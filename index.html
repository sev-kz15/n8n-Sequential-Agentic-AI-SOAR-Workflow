<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>n8n workflow</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1f1f1f; color-scheme: dark; }
  #canvas { position: fixed; inset: 0; overflow: hidden; }
  #canvas-inner { transform-origin: 0 0; }
  n8n-demo {
    display: block;
    --n8n-workflow-min-height: var(--canvas-h, 100vh);
    --n8n-frame-background-color: #1f1f1f;
  }
  #fail {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #d6d6d6;
  }
  #fail a { color: #7fd0d4; }
</style>
</head>
<body>
<div id="canvas">
  <div id="canvas-inner">
    <n8n-demo id="wf" theme="dark" collapseformobile="false" clicktointeract="false" hidecanvaserrors="true"></n8n-demo>
  </div>
</div>
<script>
  (function () {
    var LOGICAL_W = 1000;
    var frame = document.getElementById('canvas');
    var inner = document.getElementById('canvas-inner');
    var el = document.getElementById('wf');
    var detailOpen = false;

    function fit() {
      var w = frame.clientWidth, h = frame.clientHeight;
      if (!w || !h) return;
      if (detailOpen || w >= LOGICAL_W) {
        inner.style.width = ''; inner.style.transform = '';
        el.style.setProperty('--canvas-h', h + 'px');
        return;
      }
      var s = w / LOGICAL_W;
      inner.style.width = LOGICAL_W + 'px';
      inner.style.transform = 'scale(' + s + ')';
      el.style.setProperty('--canvas-h', Math.ceil(h / s) + 'px');
    }

    window.addEventListener('message', function (e) {
      if (typeof e.data !== 'string') return;
      try {
        var cmd = JSON.parse(e.data).command;
        if (cmd === 'openNDV') { detailOpen = true; fit(); }
        if (cmd === 'closeNDV') { detailOpen = false; fit(); }
      } catch (err) {}
    });
    if ('ResizeObserver' in window) {
      new ResizeObserver(fit).observe(frame);
    } else {
      window.addEventListener('resize', fit);
    }
    fit();

    fetch('workflow.json')
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (wf) {
        el.setAttribute('workflow', wf);
        return import('https://cdn.jsdelivr.net/npm/@n8n_io/n8n-demo-component@1.0.20/n8n-demo.bundled.js');
      })
      .catch(function () {
        document.body.insertAdjacentHTML('beforeend', '<div id="fail"><p>The workflow view could not be loaded. <a href="workflow.json">Open the workflow JSON</a>.</p></div>');
      });
  })();
</script>
</body>
</html>
